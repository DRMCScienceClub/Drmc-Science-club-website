<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Quantum Horizon science festival illustration</title>
  <desc id="desc">A dark navy scientific grid with orbital paths, an atom, and circuit details in blue and teal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06162c"/>
      <stop offset="0.58" stop-color="#0a2851"/>
      <stop offset="1" stop-color="#083f55"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#28d8ce" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#169dd8" stop-opacity=".11"/>
      <stop offset="1" stop-color="#169dd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#45e3d6"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#90b6d6" stroke-width="1" stroke-opacity=".08"/>
      <circle cx="0" cy="0" r="2" fill="#7dd3fc" fill-opacity=".17"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1240" cy="385" r="465" fill="url(#halo)"/>
  <path d="M0 718C214 645 389 667 565 720s341 71 545-10 344-101 490-60v250H0Z" fill="#041426" fill-opacity=".66"/>
  <g fill="none" stroke="#78dbed" stroke-opacity=".28">
    <path d="M1000 69c132 56 216 151 252 285 40 148 9 303-86 426"/>
    <path d="M1042 39c182 51 307 165 365 339 51 154 29 310-66 452"/>
    <path d="M941 111c93 45 148 115 170 211 31 135-9 255-117 359"/>
  </g>
  <g transform="translate(1150 420)" fill="none" stroke-linecap="round">
    <ellipse rx="275" ry="94" transform="rotate(-17)" stroke="#42d6d0" stroke-width="3" stroke-opacity=".72"/>
    <ellipse rx="275" ry="94" transform="rotate(43)" stroke="#60a5fa" stroke-width="3" stroke-opacity=".68"/>
    <ellipse rx="275" ry="94" transform="rotate(103)" stroke="#a5e7e2" stroke-width="2" stroke-opacity=".42"/>
    <circle r="59" fill="#1b78b5" stroke="#8ceee6" stroke-width="4"/>
    <circle r="37" fill="#55e1d4" fill-opacity=".2"/>
    <circle cx="-245" cy="-68" r="16" fill="#52e1d5" stroke="#d3faf6" stroke-width="4"/>
    <circle cx="196" cy="-154" r="14" fill="#60a5fa" stroke="#dbeafe" stroke-width="4"/>
    <circle cx="128" cy="210" r="13" fill="#86efe7" stroke="#ecfeff" stroke-width="4"/>
  </g>
  <g stroke="#4ddfd3" stroke-opacity=".55" fill="none" stroke-width="2">
    <path d="M1300 696v57h88v52"/>
    <path d="M1390 624h71v-73h78"/>
    <path d="M880 656h-67v64h-91"/>
    <circle cx="1388" cy="805" r="7" fill="#4ddfd3"/>
    <circle cx="1539" cy="551" r="7" fill="#4ddfd3"/>
    <circle cx="722" cy="720" r="7" fill="#4ddfd3"/>
  </g>
  <g transform="translate(116 154)">
    <rect width="245" height="42" rx="21" fill="#0a3852" stroke="#59ded6" stroke-opacity=".52"/>
    <circle cx="24" cy="21" r="6" fill="#52e0d5"/>
    <text x="43" y="27" fill="#c9faf5" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">DRMC SCIENCE FESTIVAL</text>
    <text x="0" y="143" fill="#f4fbff" font-family="Arial, Helvetica, sans-serif" font-size="75" font-weight="800" letter-spacing="-2">QUANTUM</text>
    <text x="0" y="222" fill="url(#accent)" font-family="Arial, Helvetica, sans-serif" font-size="75" font-weight="800" letter-spacing="-2">HORIZON</text>
    <text x="2" y="280" fill="#b6d6e8" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="4">OBSERVE • QUESTION • DISCOVER</text>
    <path d="M2 327h458" stroke="url(#accent)" stroke-width="4"/>
    <text x="0" y="431" fill="#e8f7ff" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="300">2026</text>
  </g>
  <g transform="translate(115 790)" fill="#92b9cf" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2">
    <text>PHYSICS</text><circle cx="113" cy="-5" r="3" fill="#45dfd3"/>
    <text x="133">ROBOTICS</text><circle cx="255" cy="-5" r="3" fill="#45dfd3"/>
    <text x="275">ASTRONOMY</text><circle cx="414" cy="-5" r="3" fill="#45dfd3"/>
    <text x="434">INNOVATION</text>
  </g>
</svg>
